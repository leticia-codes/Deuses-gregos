<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Olimpo</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="history-page">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">OLIMPO</div>
    <div class="menu">
      <a href="index.html">INÍCIO</a>
      <a href="historia.html">ORIGEM</a>
      <a href="divindades.html">DIVINDADES</a>
      <a href="contato.html" class="active">CONTATO</a>
    </div>
  </nav>

  <!-- Seção Contato -->
  <section class="timeline-section">

    <div class="timeline-header">
      <h2 class="sub-title">FALAR COM OS DEUSES</h2>
      <h1>ENTRE EM <span class="gold">CONTATO</span></h1>
    </div>

    <div style="max-width:600px; margin:auto; text-align:center;">

      <p class="description">
        Se deseja enviar uma mensagem ao Olimpo, preencher o formulário abaixo
        e os deuses responderão quando o destino permitir.
      </p>

      <form>

        <input type="text" placeholder="Seu nome" required style="
        width:100%;
        padding:15px;
        margin:10px 0;
        background:#111;
        border:1px solid rgba(197,163,88,0.4);
        color:white;
        font-family:Inter;
        ">

        <input type="email" placeholder="Seu email" required style="
        width:100%;
        padding:15px;
        margin:10px 0;
        background:#111;
        border:1px solid rgba(197,163,88,0.4);
        color:white;
        font-family:Inter;
        ">

        <textarea placeholder="Sua mensagem" rows="5" style="
        width:100%;
        padding:15px;
        margin:10px 0 20px 0;
        background:#111;
        border:1px solid rgba(197,163,88,0.4);
        color:white;
        font-family:Inter;
        "></textarea>

        <button class="btn-classic">ENVIAR MENSAGEM</button>

      </form>

    </div>

    <div style="text-align:center; margin-top:80px; opacity:0.5; font-size:0.8rem;">
      <p>© 2026 OLIMPO — Inspirado na Mitologia Grega</p>
    </div>

  </section>

</body>
</html>
